appId: com.eye112.app
productName: Eye112
artifactName: "${productName}-Setup-${version}.${ext}"

directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: node_modules/onnxruntime-web/dist
    to: onnx-wasm
    filter:
      - "**/*.wasm"
      - "**/*.mjs"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Eye112
  differentialPackage: true
publish:
  provider: github
  owner: InnokentiiMalta
  repo: Eye112
  releaseType: draft
