name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например, 1.0.3). Должна совпадать с version в package.json.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}

      - name: Build and publish
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- НОВЫЙ ШАГ: Принудительная загрузка blockmap в релиз ---
      - name: Upload blockmap to release
        run: |
          $version = "${{ inputs.version }}"
          $tag = "v$version"
          $blockmapFile = "release/Eye112 Setup $version.exe.blockmap"
          
          if (Test-Path $blockmapFile) {
            Write-Host "Uploading $blockmapFile to release $tag..."
            gh release upload $tag $blockmapFile --clobber
          } else {
            Write-Error "Blockmap file not found at: $blockmapFile"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- КОНЕЦ НОВОГО ШАГА ---
